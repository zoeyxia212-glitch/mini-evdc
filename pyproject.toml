[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-evdc"
version = "1.4.0"
description = "A simplified enterprise virtual data center plus a multi-cloud (Alibaba Cloud, AWS, Azure) integration service"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Zoey Xia" }]
license = { text = "MIT" }
dependencies = []

[project.scripts]
evdc = "evdc.__main__:main"

[project.optional-dependencies]
aws = ["boto3>=1.34"]

[tool.setuptools.packages.find]
include = ["evdc*"]

[tool.setuptools.package-data]
evdc = ["web/*.html"]
