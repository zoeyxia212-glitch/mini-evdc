apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-evdc
spec:
  # One replica: the store is SQLite on a ReadWriteOnce volume. Scaling out needs the
  # PostgreSQL backend from docs/ROADMAP.md; then switch to RollingUpdate and add a PodDisruptionBudget.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: mini-evdc
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: mini-evdc
          imagePullPolicy: IfNotPresent
          args:
            - evdc
            - serve
            - --host=0.0.0.0
            - --port=8080
            - --db=/data/evdc.db
            - --config=/config/accounts.json
            - --sync-interval=$(SYNC_INTERVAL)
            - --shutdown-grace=10      # < terminationGracePeriodSeconds, so in-flight requests finish
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SYNC_INTERVAL
              valueFrom:
                configMapKeyRef: {name: mini-evdc-config, key: SYNC_INTERVAL}
          envFrom:
            - secretRef:
                name: mini-evdc-secrets
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mini-evdc-data
        - name: config
          configMap:
            name: mini-evdc-config
            items: [{key: accounts.json, path: accounts.json}]
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
