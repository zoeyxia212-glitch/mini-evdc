apiVersion: v1
kind: ConfigMap
metadata:
  name: mini-evdc-config
data:
  # Account definitions only. Credentials are "env:VAR" references, filled from the Secret.
  accounts.json: |
    {
      "accounts": [
        {"provider": "aliyun", "account": "ali-prod", "fake": true,
         "credentials": {"access_key_id": "env:ALIYUN_AK", "access_key_secret": "env:ALIYUN_SK"}},
        {"provider": "aws", "account": "aws-syd", "fake": true,
         "credentials": {"access_key": "env:AWS_AK", "secret_key": "env:AWS_SK"}},
        {"provider": "azure", "account": "az-au", "fake": true,
         "credentials": {"tenant_id": "env:AZ_TENANT", "client_id": "env:AZ_CLIENT", "client_secret": "env:AZ_SECRET"}}
      ]
    }
  SYNC_INTERVAL: "300"
