apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mini-evdc
resources:
  - ../../base
  - ingress.yaml
patches:
  - target: {kind: PersistentVolumeClaim, name: mini-evdc-data}
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
images:
  - name: mini-evdc
    newName: ghcr.io/OWNER/mini-evdc
    newTag: "1.6.0"     # pin a released version; never :latest in production
